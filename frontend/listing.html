<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advertentie analyse | Productswaarde</title>
  <meta name="description" content="Is deze Marktplaats advertentie een goede deal? Vergelijk met de marktprijs." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="static/style.css" />
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200">
    <nav class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="index.html" class="text-xl font-bold text-gray-900 shrink-0">
        Products<span class="text-emerald-600">waarde</span>
      </a>
      <form id="search-form" class="hidden sm:flex flex-1 max-w-md">
        <input
          id="search-input"
          type="text"
          required
          placeholder="Zoek een product..."
          class="flex-1 rounded-l-lg border border-gray-200 px-4 py-2 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
        />
        <button type="submit" class="rounded-r-lg bg-emerald-600 px-4 py-2 text-sm font-semibold text-white hover:bg-emerald-700 transition-colors">
          Zoeken
        </button>
      </form>
      <div class="flex items-center gap-4 sm:gap-6 text-sm font-medium text-gray-500 shrink-0">
        <a href="deals.html" class="hover:text-emerald-600">Deals</a>
        <a href="alerts.html" class="hover:text-emerald-600">Prijsalert</a>
      </div>
    </nav>
  </header>

  <main id="listing-root" class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 py-8 w-full">

    <p id="listing-loading" class="text-gray-500">🔍 Advertentie wordt geanalyseerd...</p>

    <p id="listing-error" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-xl p-4 text-sm"></p>

    <div id="listing-content" class="hidden">

      <div id="listing-image-wrap" class="w-full"></div>

      <div class="mt-6 flex flex-wrap items-start justify-between gap-3">
        <h1 id="listing-title" class="text-xl sm:text-2xl font-bold text-gray-900 max-w-2xl">...</h1>
        <span id="listing-deal-badge" class="shrink-0"></span>
      </div>

      <div class="mt-3 flex items-baseline gap-3">
        <span id="listing-price" class="text-3xl font-extrabold text-gray-900"></span>
      </div>
      <p id="listing-discount" class="mt-1 text-sm text-gray-500"></p>

      <div class="mt-6 bg-white border border-gray-200 shadow-sm rounded-xl p-5">
        <div class="text-xs font-medium text-gray-500 mb-3">Prijs versus marktmediaan</div>
        <div id="listing-comparison-bar"></div>
      </div>

      <div class="mt-4 bg-white border border-gray-200 shadow-sm rounded-xl p-5">
        <div class="text-xs font-medium text-gray-500 mb-3">Kenmerken</div>
        <div id="listing-facts" class="grid grid-cols-2 sm:grid-cols-3 gap-4"></div>
      </div>

      <div id="listing-warnings" class="mt-4 grid gap-3"></div>

      <a
        id="listing-cta"
        href="#"
        target="_blank"
        rel="noopener"
        class="mt-6 flex items-center justify-center gap-2 rounded-lg bg-emerald-600 px-6 py-3.5 font-semibold text-white hover:bg-emerald-700 transition-colors"
      >
        Bekijk op Marktplaats →
      </a>

      <div id="similar-listings-section" class="hidden mt-12">
        <h2 class="text-lg font-bold text-gray-900 mb-4">Vergelijkbare advertenties</h2>
        <div id="similar-listings" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </div>

    </div>

  </main>

  <footer class="bg-white border-t border-gray-200">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-gray-500">
      <p>&copy; 2026 Productswaarde.nl</p>
      <div class="flex gap-6">
        <a href="deals.html" class="hover:text-emerald-600">Deals</a>
        <a href="alerts.html" class="hover:text-emerald-600">Prijsalert</a>
        <a href="privacy.html" class="hover:text-emerald-600">Privacybeleid</a>
      </div>
    </div>
  </footer>

  <script src="static/app.js"></script>
</body>
</html>
